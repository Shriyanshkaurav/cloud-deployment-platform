apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-platform-demo
  labels:
    app: deployment-platform-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-platform-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: deployment-platform-demo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: deployment-platform-demo:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.1.0"
            - name: ENVIRONMENT
              value: "local-kubernetes"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
